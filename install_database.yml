---
- name: Setup Dynamic Target Host
  hosts: localhost
  gather_facts: no
  vars:
    target_server_ip: "{{ server_ip }}"
    target_server_user: "{{ server_user }}"
    target_server_password: "{{ server_password }}"
  tasks:
    - name: Validate required connection inputs
      assert:
        that:
          - target_server_ip is defined
          - target_server_ip | length > 0
          - target_server_user is defined
          - target_server_user | length > 0
          - target_server_password is defined
        fail_msg: "Required survey fields missing: server_ip, server_user, or server_password"

    - name: Add target server dynamically
      add_host:
        name: dynamic_db_target
        groups: dynamic_targets
        ansible_host: "{{ target_server_ip }}"
        ansible_user: "{{ target_server_user }}"
        ansible_password: "{{ target_server_password }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

- name: Install Database on Target Server
  hosts: dynamic_targets
  become: yes
  gather_facts: yes
  vars:
    db_type: "{{ db_type }}"
    db_version: "{{ db_version }}"
    db_name: "{{ db_name }}"
    db_admin_user: "{{ db_admin_user }}"
    db_admin_password: "{{ db_admin_password }}"

    db_port_map:
      postgresql: 5432
      mysql: 3306
      mariadb: 3306
      mongodb: 27017

    data_dir_map:
      postgresql: "/var/lib/pgsql/{{ db_version }}/data"
      mysql: "/var/lib/mysql"
      mariadb: "/var/lib/mysql"
      mongodb: "/var/lib/mongo"

    db_port: "{{ db_port_map[db_type] }}"
    data_dir: "{{ data_dir_map[db_type] }}"

    supported_db_types:
      - postgresql
      - mysql
      - mariadb
      - mongodb

  pre_tasks:
    - name: Validate required database inputs
      assert:
        that:
          - db_type is defined
          - db_type in supported_db_types
          - db_version is defined
          - db_version | length > 0
          - db_name is defined
          - db_name | length > 0
          - db_admin_user is defined
          - db_admin_user | length > 0
          - db_admin_password is defined
          - db_admin_password | length > 0
        fail_msg: "Required survey fields missing or invalid. Required: db_type, db_version, db_name, db_admin_user, db_admin_password"

    - name: Validate supported operating system
      assert:
        that:
          - ansible_os_family == "RedHat"
        fail_msg: "This playbook currently supports only RHEL/CentOS/Rocky/AlmaLinux style systems."

    - name: Display installation parameters
      debug:
        msg: |
          Database Installation Parameters
          =================================
          Target Server: {{ ansible_host }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Database Type: {{ db_type }}
          Database Version: {{ db_version }}
          Database Name: {{ db_name }}
          Admin User: {{ db_admin_user }}
          Database Port: {{ db_port }}
          Data Directory: {{ data_dir }}

  tasks:
    - name: Install PostgreSQL
      block:
        - name: Install PostgreSQL repository
          yum:
            name: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_distribution_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm"
            state: present
            disable_gpg_check: yes

        - name: Disable default PostgreSQL module for RHEL 8+
          shell: dnf -qy module disable postgresql
          when: ansible_distribution_major_version | int >= 8
          changed_when: false
          failed_when: false

        - name: Install PostgreSQL packages
          yum:
            name:
              - "postgresql{{ db_version }}-server"
              - "postgresql{{ db_version }}"
              - "postgresql{{ db_version }}-contrib"
            state: present

        - name: Ensure PostgreSQL data parent directory exists
          file:
            path: "{{ data_dir | dirname }}"
            state: directory
            mode: "0755"

        - name: Initialize PostgreSQL database
          shell: "/usr/pgsql-{{ db_version }}/bin/postgresql-{{ db_version }}-setup initdb"
          args:
            creates: "{{ data_dir }}/PG_VERSION"

        - name: Configure PostgreSQL listen_addresses
          lineinfile:
            path: "{{ data_dir }}/postgresql.conf"
            regexp: "^#?listen_addresses\\s*="
            line: "listen_addresses = *"

        - name: Configure PostgreSQL client authentication
          lineinfile:
            path: "{{ data_dir }}/pg_hba.conf"
            line: "host    all             all             0.0.0.0/0               md5"

        - name: Start and enable PostgreSQL service
          systemd:
            name: "postgresql-{{ db_version }}"
            state: started
            enabled: yes

        - name: Create PostgreSQL database
          become_user: postgres
          shell: psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'" | grep -q 1 || psql -c "CREATE DATABASE {{ db_name }};"
          changed_when: true

        - name: Create PostgreSQL admin user and grant privileges
          become_user: postgres
          shell: |
            psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_admin_user }}'" | grep -q 1 || psql -c "CREATE USER {{ db_admin_user }} WITH PASSWORD '{{ db_admin_password }}';"
            psql -c "ALTER USER {{ db_admin_user }} WITH PASSWORD '{{ db_admin_password }}';"
            psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_admin_user }};"
          changed_when: true

        - name: Open firewall for PostgreSQL
          firewalld:
            port: "{{ db_port }}/tcp"
            permanent: yes
            state: enabled
            immediate: yes
          ignore_errors: yes
      when: db_type == "postgresql"

    - name: Install MySQL or MariaDB
      block:
        - name: Install MySQL/MariaDB packages
          yum:
            name:
              - mariadb-server
              - mariadb
              - python3-PyMySQL
            state: present

        - name: Start and enable MariaDB service
          systemd:
            name: mariadb
            state: started
            enabled: yes

        - name: Set MariaDB root password if needed
          shell: |
            mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_admin_password }}';" || true
          changed_when: false

        - name: Create MySQL/MariaDB database
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
          changed_when: true

        - name: Create MySQL/MariaDB admin user
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE USER IF NOT EXISTS '{{ db_admin_user }}'@'%' IDENTIFIED BY '{{ db_admin_password }}';"
            mysql -u root -p'{{ db_admin_password }}' -e "GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_admin_user }}'@'%';"
            mysql -u root -p'{{ db_admin_password }}' -e "FLUSH PRIVILEGES;"
          changed_when: true

        - name: Open firewall for MySQL/MariaDB
          firewalld:
            port: "{{ db_port }}/tcp"
            permanent: yes
            state: enabled
            immediate: yes
          ignore_errors: yes
      when: db_type in ["mysql", "mariadb"]

    - name: Install MongoDB
      block:
        - name: Add MongoDB repository
          yum_repository:
            name: mongodb-org
            description: MongoDB Repository
            baseurl: "https://repo.mongodb.org/yum/redhat/\$releasever/mongodb-org/{{ db_version }}/x86_64/"
            gpgcheck: yes
            enabled: yes
            gpgkey: "https://www.mongodb.org/static/pgp/server-{{ db_version }}.asc"

        - name: Install MongoDB packages
          yum:
            name: mongodb-org
            state: present

        - name: Ensure MongoDB data directory exists
          file:
            path: "{{ data_dir }}"
            state: directory
            owner: mongod
            group: mongod
            mode: "0755"

        - name: Configure MongoDB bind IP
          lineinfile:
            path: /etc/mongod.conf
            regexp: "^  bindIp:"
            line: "  bindIp: 0.0.0.0"

        - name: Start and enable MongoDB service
          systemd:
            name: mongod
            state: started
            enabled: yes

        - name: Create MongoDB admin user
          shell: |
            mongosh admin --eval "db.createUser({user: '{{ db_admin_user }}', pwd: '{{ db_admin_password }}', roles: [{role: 'root', db: 'admin'}]})"
          register: mongodb_user_result
          failed_when: mongodb_user_result.rc != 0 and ("already exists" not in (mongodb_user_result.stdout + mongodb_user_result.stderr))
          changed_when: "already exists" not in (mongodb_user_result.stdout + mongodb_user_result.stderr)

        - name: Open firewall for MongoDB
          firewalld:
            port: "{{ db_port }}/tcp"
            permanent: yes
            state: enabled
            immediate: yes
          ignore_errors: yes
      when: db_type == "mongodb"

  post_tasks:
    - name: Display success message
      debug:
        msg: |
          Database installation complete.

          Details:
          - Type: {{ db_type }}
          - Version: {{ db_version }}
          - Database Name: {{ db_name }}
          - Admin User: {{ db_admin_user }}
          - Port: {{ db_port }}
          - Data Directory: {{ data_dir }}

          Connection Examples:
          {% if db_type == "postgresql" %}
          psql -h {{ ansible_host }} -p {{ db_port }} -U {{ db_admin_user }} -d {{ db_name }}
          {% elif db_type in ["mysql", "mariadb"] %}
          mysql -h {{ ansible_host }} -P {{ db_port }} -u {{ db_admin_user }} -p {{ db_name }}
          {% elif db_type == "mongodb" %}
          mongosh "mongodb://{{ db_admin_user }}:{{ db_admin_password }}@{{ ansible_host }}:{{ db_port }}/admin"
          {% endif %}
