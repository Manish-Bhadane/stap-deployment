---
- name: Setup Dynamic Target Host
  hosts: localhost
  gather_facts: false
  vars:
    target_platform: "{{ platform | lower }}"
    target_server_ip: "{{ server_ip }}"
    target_server_user: "{{ server_user }}"
    target_server_password: "{{ server_password }}"
  tasks:
    - name: Validate required connection inputs
      assert:
        that:
          - target_platform is defined
          - target_platform in ['linux', 'windows']
          - target_server_ip is defined
          - target_server_ip | length > 0
          - target_server_user is defined
          - target_server_user | length > 0
          - target_server_password is defined
          - target_server_password | length > 0
        fail_msg: "Required survey fields missing: platform, server_ip, server_user, server_password"

    - name: Add Linux target dynamically
      add_host:
        name: dynamic_db_target
        groups: dynamic_targets
        ansible_host: "{{ target_server_ip }}"
        ansible_user: "{{ target_server_user }}"
        ansible_password: "{{ target_server_password }}"
        ansible_connection: ssh
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        ansible_python_interpreter: /usr/bin/python3
      when: target_platform == 'linux'
      changed_when: false

    - name: Add Windows target dynamically
      add_host:
        name: dynamic_db_target
        groups: dynamic_targets
        ansible_host: "{{ target_server_ip }}"
        ansible_user: "{{ target_server_user }}"
        ansible_password: "{{ target_server_password }}"
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_shell_type: powershell
      when: target_platform == 'windows'
      changed_when: false

- name: Install Database on Target Server
  hosts: dynamic_targets
  gather_facts: true
  become: "{{ platform | lower == 'linux' }}"
  vars:
    platform: "{{ platform | lower }}"
    db_type: "{{ db_type | lower }}"
    db_name: "{{ db_name }}"
    db_admin_user: "{{ db_admin_user }}"
    db_admin_password: "{{ db_admin_password }}"

    supported_db_types:
      - postgresql
      - mysql
      - mariadb
      - mongodb

    db_port_map:
      postgresql: 5432
      mysql: 3306
      mariadb: 3306
      mongodb: 27017

    db_port: "{{ db_port_map[db_type] }}"

    linux_data_dir_map:
      postgresql: "/var/lib/pgsql/data"
      mysql: "/var/lib/mysql"
      mariadb: "/var/lib/mysql"
      mongodb: "/var/lib/mongo"

    windows_data_dir_map:
      postgresql: "C:\\Program Files\\PostgreSQL\\data"
      mysql: "C:\\ProgramData\\MySQL\\MySQL Server\\Data"
      mariadb: "C:\\Program Files\\MariaDB\\data"
      mongodb: "C:\\data\\db"

    data_dir: >-
      {{
        linux_data_dir_map[db_type]
        if platform == 'linux'
        else windows_data_dir_map[db_type]
      }}

  pre_tasks:
    - name: Validate required database inputs
      assert:
        that:
          - platform in ['linux', 'windows']
          - db_type in supported_db_types
          - db_name is defined
          - db_name | length > 0
          - db_admin_user is defined
          - db_admin_user | length > 0
          - db_admin_password is defined
          - db_admin_password | length > 0
        fail_msg: "Required survey fields missing or invalid. Required: platform, db_type, db_name, db_admin_user, db_admin_password"

    - name: Display installation parameters
      debug:
        msg: |
          Database Installation Parameters
          =================================
          Target Server: {{ ansible_host }}
          Platform: {{ platform }}
          OS Family: {{ ansible_os_family | default('windows') }}
          Database Type: {{ db_type }}
          Database Name: {{ db_name }}
          Admin User: {{ db_admin_user }}
          Database Port: {{ db_port }}
          Data Directory: {{ data_dir }}

  tasks:
    - name: Linux | PostgreSQL on RedHat family
      block:
        - name: Install PostgreSQL packages on RedHat
          dnf:
            name:
              - postgresql-server
              - postgresql
            state: present

        - name: Initialize PostgreSQL database on RedHat
          command: postgresql-setup --initdb
          args:
            creates: /var/lib/pgsql/data/PG_VERSION

        - name: Configure PostgreSQL listen_addresses
          lineinfile:
            path: /var/lib/pgsql/data/postgresql.conf
            regexp: "^#?listen_addresses\\s*="
            line: "listen_addresses = '*'"

        - name: Configure PostgreSQL client authentication
          lineinfile:
            path: /var/lib/pgsql/data/pg_hba.conf
            line: "host    all             all             0.0.0.0/0               md5"

        - name: Start and enable PostgreSQL on RedHat
          systemd:
            name: postgresql
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'postgresql'
        - ansible_os_family == 'RedHat'

    - name: Linux | PostgreSQL on Debian family
      block:
        - name: Install PostgreSQL packages on Debian
          apt:
            name:
              - postgresql
            state: present
            update_cache: true

        - name: Start and enable PostgreSQL on Debian
          service:
            name: postgresql
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'postgresql'
        - ansible_os_family == 'Debian'

    - name: Linux | PostgreSQL on SUSE family not yet implemented
      fail:
        msg: "PostgreSQL installation for SUSE is not yet implemented in this playbook."
      when:
        - platform == 'linux'
        - db_type == 'postgresql'
        - ansible_os_family == 'Suse'

    - name: Linux | MySQL on RedHat family
      block:
        - name: Install MySQL community repo package for EL8
          dnf:
            name: https://repo.mysql.com/mysql80-community-release-el8-1.noarch.rpm
            state: present
            disable_gpg_check: true
          when: ansible_distribution_major_version | int == 8

        - name: Install MySQL community repo package for EL9
          dnf:
            name: https://repo.mysql.com/mysql80-community-release-el9-1.noarch.rpm
            state: present
            disable_gpg_check: true
          when: ansible_distribution_major_version | int == 9

        - name: Disable default MySQL module if present
          command: dnf -qy module disable mysql
          changed_when: false
          failed_when: false

        - name: Install MySQL Community Server on RedHat
          dnf:
            name: mysql-community-server
            state: present

        - name: Start and enable MySQL on RedHat
          systemd:
            name: mysqld
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mysql'
        - ansible_os_family == 'RedHat'

    - name: Linux | MySQL on Debian family
      block:
        - name: Install MySQL packages on Debian
          apt:
            name:
              - mysql-server
            state: present
            update_cache: true

        - name: Start and enable MySQL on Debian
          service:
            name: mysql
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mysql'
        - ansible_os_family == 'Debian'

    - name: Linux | MySQL on SUSE family not yet implemented
      fail:
        msg: "MySQL installation for SUSE is not yet implemented in this playbook."
      when:
        - platform == 'linux'
        - db_type == 'mysql'
        - ansible_os_family == 'Suse'

    - name: Linux | MariaDB on RedHat family
      block:
        - name: Install MariaDB packages on RedHat
          dnf:
            name:
              - mariadb-server
              - mariadb
            state: present

        - name: Start and enable MariaDB on RedHat
          systemd:
            name: mariadb
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mariadb'
        - ansible_os_family == 'RedHat'

    - name: Linux | MariaDB on Debian family
      block:
        - name: Install MariaDB packages on Debian
          apt:
            name:
              - mariadb-server
            state: present
            update_cache: true

        - name: Start and enable MariaDB on Debian
          service:
            name: mariadb
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mariadb'
        - ansible_os_family == 'Debian'

    - name: Linux | MariaDB on SUSE family not yet implemented
      fail:
        msg: "MariaDB installation for SUSE is not yet implemented in this playbook."
      when:
        - platform == 'linux'
        - db_type == 'mariadb'
        - ansible_os_family == 'Suse'

    - name: Linux | MongoDB on RedHat family
      block:
        - name: Add MongoDB repository on RedHat
          yum_repository:
            name: mongodb-org-7.0
            description: MongoDB Repository
            baseurl: "https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org/7.0/x86_64/"
            gpgcheck: true
            enabled: true
            gpgkey: "https://pgp.mongodb.com/server-7.0.asc"

        - name: Install MongoDB packages on RedHat
          dnf:
            name: mongodb-org
            state: present

        - name: Ensure MongoDB data directory exists
          file:
            path: "{{ data_dir }}"
            state: directory
            owner: mongod
            group: mongod
            mode: "0755"

        - name: Configure MongoDB bind IP
          lineinfile:
            path: /etc/mongod.conf
            regexp: "^  bindIp:"
            line: "  bindIp: 0.0.0.0"

        - name: Start and enable MongoDB on RedHat
          systemd:
            name: mongod
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mongodb'
        - ansible_os_family == 'RedHat'

    - name: Linux | MongoDB on Debian family
      block:
        - name: Install prerequisite packages on Debian
          apt:
            name:
              - gnupg
              - curl
            state: present
            update_cache: true

        - name: Add MongoDB apt key on Debian
          apt_key:
            url: "https://pgp.mongodb.com/server-7.0.asc"
            state: present

        - name: Add MongoDB apt repository on Debian
          apt_repository:
            repo: "deb [ arch=amd64 ] https://repo.mongodb.org/apt/{{ ansible_distribution | lower }} {{ ansible_distribution_release }}/mongodb-org/7.0 multiverse"
            state: present
            filename: mongodb-org-7.0

        - name: Install MongoDB packages on Debian
          apt:
            name: mongodb-org
            state: present
            update_cache: true

        - name: Start and enable MongoDB on Debian
          service:
            name: mongod
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mongodb'
        - ansible_os_family == 'Debian'

    - name: Linux | MongoDB on SUSE not yet implemented
      fail:
        msg: "MongoDB installation for SUSE is not yet implemented in this playbook."
      when:
        - platform == 'linux'
        - db_type == 'mongodb'
        - ansible_os_family == 'Suse'

    - name: Linux | Configure PostgreSQL database and user
      block:
        - name: Create PostgreSQL database
          become_user: postgres
          shell: psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'" | grep -q 1 || psql -c "CREATE DATABASE {{ db_name }};"
          changed_when: true

        - name: Create PostgreSQL admin user
          become_user: postgres
          shell: |
            psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_admin_user }}'" | grep -q 1 || psql -c "CREATE USER {{ db_admin_user }} WITH PASSWORD '{{ db_admin_password }}';"
            psql -c "ALTER USER {{ db_admin_user }} WITH PASSWORD '{{ db_admin_password }}';"
            psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_admin_user }};"
          changed_when: true
      when:
        - platform == 'linux'
        - db_type == 'postgresql'

    - name: Linux | Configure MySQL database and user
      block:
        - name: Read MySQL temporary root password if present
          shell: grep 'temporary password' /var/log/mysqld.log | tail -1 | awk '{print $NF}'
          register: mysql_temp_password
          changed_when: false
          failed_when: false

        - name: Set MySQL root password using temporary password
          shell: |
            mysql --connect-expired-password -u root -p'{{ mysql_temp_password.stdout }}' -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_admin_password }}';"
          when: mysql_temp_password.stdout | length > 0
          changed_when: true
          failed_when: false

        - name: Set MySQL root password if already initialized
          shell: |
            mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_admin_password }}';" || true
          when: mysql_temp_password.stdout | length == 0
          changed_when: false

        - name: Create MySQL database
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
          changed_when: true

        - name: Create MySQL admin user
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE USER IF NOT EXISTS '{{ db_admin_user }}'@'%' IDENTIFIED BY '{{ db_admin_password }}';"
            mysql -u root -p'{{ db_admin_password }}' -e "GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_admin_user }}'@'%';"
            mysql -u root -p'{{ db_admin_password }}' -e "FLUSH PRIVILEGES;"
          changed_when: true
      when:
        - platform == 'linux'
        - db_type == 'mysql'

    - name: Linux | Configure MariaDB database and user
      block:
        - name: Set MariaDB root password if needed
          shell: |
            mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_admin_password }}';" || true
          changed_when: false

        - name: Create MariaDB database
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
          changed_when: true

        - name: Create MariaDB admin user
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE USER IF NOT EXISTS '{{ db_admin_user }}'@'%' IDENTIFIED BY '{{ db_admin_password }}';"
            mysql -u root -p'{{ db_admin_password }}' -e "GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_admin_user }}'@'%';"
            mysql -u root -p'{{ db_admin_password }}' -e "FLUSH PRIVILEGES;"
          changed_when: true
      when:
        - platform == 'linux'
        - db_type == 'mariadb'

    - name: Linux | Configure MongoDB admin user
      block:
        - name: Create MongoDB admin user
          shell: |
            mongosh admin --eval "db.createUser({user: '{{ db_admin_user }}', pwd: '{{ db_admin_password }}', roles: [{role: 'root', db: 'admin'}]})"
          register: mongodb_user_result
          failed_when: mongodb_user_result.rc != 0 and ('already exists' not in (mongodb_user_result.stdout + mongodb_user_result.stderr))
          changed_when: "'already exists' not in (mongodb_user_result.stdout + mongodb_user_result.stderr)"
      when:
        - platform == 'linux'
        - db_type == 'mongodb'

    - name: Windows | PostgreSQL not yet implemented
      fail:
        msg: "Windows automated installation for PostgreSQL is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'postgresql'

    - name: Windows | MySQL not yet implemented
      fail:
        msg: "Windows automated installation for MySQL is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'mysql'

    - name: Windows | MariaDB not yet implemented
      fail:
        msg: "Windows automated installation for MariaDB is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'mariadb'

    - name: Windows | MongoDB not yet implemented
      fail:
        msg: "Windows automated installation for MongoDB is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'mongodb'

  post_tasks:
    - name: Display success message
      debug:
        msg: |
          Database installation completed.

          Details:
          - Platform: {{ platform }}
          - Type: {{ db_type }}
          - Database Name: {{ db_name }}
          - Admin User: {{ db_admin_user }}
          - Port: {{ db_port }}
          - Data Directory: {{ data_dir }}

