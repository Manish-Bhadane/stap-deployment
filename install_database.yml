---
- name: Setup Dynamic Target Host
  hosts: localhost
  gather_facts: false
  vars:
    target_platform: "{{ platform | lower }}"
    target_server_ip: "{{ server_ip }}"
    target_server_user: "{{ server_user }}"
    target_server_password: "{{ server_password }}"
  tasks:
    - name: Validate required connection inputs
      assert:
        that:
          - target_platform is defined
          - target_platform in ['linux', 'windows']
          - target_server_ip is defined
          - target_server_ip | length > 0
          - target_server_user is defined
          - target_server_user | length > 0
          - target_server_password is defined
          - target_server_password | length > 0
        fail_msg: "Required survey fields missing: platform, server_ip, server_user, server_password"

    - name: Add Linux target dynamically
      add_host:
        name: dynamic_db_target
        groups: dynamic_targets
        ansible_host: "{{ target_server_ip }}"
        ansible_user: "{{ target_server_user }}"
        ansible_password: "{{ target_server_password }}"
        ansible_connection: ssh
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        ansible_python_interpreter: /usr/bin/python3
      when: target_platform == 'linux'
      changed_when: false

    - name: Add Windows target dynamically
      add_host:
        name: dynamic_db_target
        groups: dynamic_targets
        ansible_host: "{{ target_server_ip }}"
        ansible_user: "{{ target_server_user }}"
        ansible_password: "{{ target_server_password }}"
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_shell_type: powershell
      when: target_platform == 'windows'
      changed_when: false

- name: Install Database on Target Server
  hosts: dynamic_targets
  gather_facts: true
  become: "{{ platform | lower == 'linux' }}"
  vars:
    platform: "{{ platform | lower }}"
    db_type: "{{ db_type | lower }}"
    db_name: "{{ db_name }}"
    db_admin_user: "{{ db_admin_user }}"
    db_admin_password: "{{ db_admin_password }}"

    supported_db_types:
      - postgresql
      - mysql
      - mariadb
      - mongodb
      - cassandra
      - oracle
      - db2
      - informix

    db_port_map:
      postgresql: 5432
      mysql: 3306
      mariadb: 3306
      mongodb: 27017
      cassandra: 9042
      oracle: 1521
      db2: 50000
      informix: 9088

    db_port: "{{ db_port_map[db_type] }}"

    linux_data_dir_map:
      postgresql: "/var/lib/pgsql/data"
      mysql: "/var/lib/mysql"
      mariadb: "/var/lib/mysql"
      mongodb: "/var/lib/mongo"
      cassandra: "/var/lib/cassandra/data"
      oracle: "/opt/oracle/oradata"
      db2: "/home/db2inst1/db2inst1"
      informix: "/opt/ibm/informix/data"

    windows_data_dir_map:
      postgresql: "C:\\Program Files\\PostgreSQL\\data"
      mysql: "C:\\ProgramData\\MySQL\\MySQL Server\\Data"
      mariadb: "C:\\Program Files\\MariaDB\\data"
      mongodb: "C:\\data\\db"
      cassandra: "C:\\ProgramData\\Cassandra\\data"
      oracle: "C:\\app\\oracle\\oradata"
      db2: "C:\\DB2\\data"
      informix: "C:\\informix\\data"

    # Optional custom package URLs (can be overridden via AWX survey or CLI vars)
    oracle_installer_url: "{{ oracle_package_url | default('https://download.oracle.com/otn-pub/otn_software/db-free/oracle-database-free-23ai-1.0-1.el8.x86_64.rpm') }}"
    oracle_preinstall_url: "{{ oracle_preinstall_package_url | default('https://yum.oracle.com/repo/OracleLinux/OL8/appstream/x86_64/getPackage/oracle-database-preinstall-23ai-1.0-2.el8.x86_64.rpm') }}"
    # Oracle release selector: "free" (default, Oracle Database Free 23ai RPM) or "19c" (Enterprise 19.3 from ZIP)
    oracle_release: "{{ oracle_db_version | default('free') | lower }}"

    # Oracle 19c settings (used only when oracle_release == '19c')
    oracle_sid: "{{ db_name | upper }}"
    oracle_pdb_name: "{{ oracle_19c_pdb_name | default('ORCLPDB1') | upper }}"
    oracle_edition: "{{ oracle_19c_edition | default('EE') }}"
    oracle_base: /u01/app/oracle
    oracle_home: /u01/app/oracle/product/19.0.0/dbhome_1
    oracle_inventory: /u01/app/oraInventory
    oracle_data_dir: /u01/oradata
    oracle_zip_path: "{{ oracle_19c_zip_path | default('/opt/LINUX.X64_193000_db_home.zip') }}"
    file_server_host: "{{ source_host | default('9.46.241.103') }}"
    file_server_user: "{{ source_user | default('root') }}"
    file_server_path: "{{ source_installer_path | default('/opt/LINUX.X64_193000_db_home.zip') }}"
    oracle_zip_sha256: "{{ oracle_19c_zip_sha256 | default('ba8329c757133da313ed3b6d7f86c5ac42cd9970a28bf2e6233f3235233aa8d8') }}"
    db2_installer_url: "{{ db2_package_url | default('') }}"
    informix_installer_url: "{{ informix_package_url | default('') }}"

    data_dir: >-
      {{
        linux_data_dir_map[db_type]
        if platform == 'linux'
        else windows_data_dir_map[db_type]
      }}

  pre_tasks:
    - name: Validate required database inputs
      assert:
        that:
          - platform in ['linux', 'windows']
          - db_type in supported_db_types
          - db_name is defined
          - db_name | length > 0
          - db_admin_user is defined
          - db_admin_user | length > 0
          - db_admin_password is defined
          - db_admin_password | length > 0
        fail_msg: "Required survey fields missing or invalid. Required: platform, db_type, db_name, db_admin_user, db_admin_password"

    - name: Display installation parameters
      debug:
        msg: |
          Database Installation Parameters
          =================================
          Target Server: {{ ansible_host }}
          Platform: {{ platform }}
          OS Family: {{ ansible_os_family | default('windows') }}
          Database Type: {{ db_type }}
          Database Name: {{ db_name }}
          Admin User: {{ db_admin_user }}
          Database Port: {{ db_port }}
          Data Directory: {{ data_dir }}

  tasks:
    - name: Linux | Detect deb822 Ubuntu source file
      shell: "ls /etc/apt/sources.list.d/*.sources 2>/dev/null | head -1"
      register: debian_sources_file
      changed_when: false
      failed_when: false
      when:
        - platform == 'linux'
        - ansible_os_family == 'Debian'

    - name: Linux | Switch Ubuntu apt sources from HTTP to HTTPS
      replace:
        path: "{{ debian_sources_file.stdout }}"
        regexp: 'http://(archive|security)\\.ubuntu\\.com/ubuntu/'
        replace: 'https://\\1.ubuntu.com/ubuntu/'
      when:
        - platform == 'linux'
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'
        - debian_sources_file.stdout | length > 0

    - name: Linux | Ensure Ubuntu universe component is enabled
      replace:
        path: "{{ debian_sources_file.stdout }}"
        regexp: '^Components:\s+main$'
        replace: 'Components: main universe'
      when:
        - platform == 'linux'
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'
        - debian_sources_file.stdout | length > 0

    - name: Linux | Update apt cache after Ubuntu repository normalization
      apt:
        update_cache: true
      when:
        - platform == 'linux'
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'

    - name: Linux | Verify Ubuntu main repository is reachable over HTTPS
      uri:
        url: "https://archive.ubuntu.com/ubuntu/dists/{{ ansible_distribution_release }}/InRelease"
        method: HEAD
        timeout: 15
        status_code: 200
      register: ubuntu_main_repo_check
      when:
        - platform == 'linux'
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'

    - name: Linux | Verify Ubuntu security repository is reachable over HTTPS
      uri:
        url: "https://security.ubuntu.com/ubuntu/dists/{{ ansible_distribution_release }}-security/InRelease"
        method: HEAD
        timeout: 15
        status_code: 200
      register: ubuntu_security_repo_check
      when:
        - platform == 'linux'
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'

    - name: Linux | Fail fast when Ubuntu package repositories are unreachable
      fail:
        msg: >-
          Ubuntu package repositories are not reachable from this target.
          Automated installation requires outbound HTTPS access to archive.ubuntu.com
          and security.ubuntu.com, or equivalent internal mirror configuration.
      when:
        - platform == 'linux'
        - ansible_os_family == 'Debian'
        - ansible_distribution == 'Ubuntu'
        - ubuntu_main_repo_check is failed or ubuntu_security_repo_check is failed

    - name: Linux | PostgreSQL on RedHat family
      block:
        - name: Install PostgreSQL packages on RedHat
          dnf:
            name:
              - postgresql-server
              - postgresql
            state: present

        - name: Initialize PostgreSQL database on RedHat
          command: postgresql-setup --initdb
          args:
            creates: /var/lib/pgsql/data/PG_VERSION

        - name: Configure PostgreSQL listen_addresses
          lineinfile:
            path: /var/lib/pgsql/data/postgresql.conf
            regexp: "^#?listen_addresses\\s*="
            line: "listen_addresses = '*'"

        - name: Configure PostgreSQL client authentication
          lineinfile:
            path: /var/lib/pgsql/data/pg_hba.conf
            line: "host    all             all             0.0.0.0/0               md5"

        - name: Start and enable PostgreSQL on RedHat
          systemd:
            name: postgresql
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'postgresql'
        - ansible_os_family == 'RedHat'

    - name: Linux | PostgreSQL on Debian family
      block:
        - name: Install PostgreSQL packages on Debian
          apt:
            name:
              - postgresql
            state: present
            update_cache: true

        - name: Start and enable PostgreSQL on Debian
          service:
            name: postgresql
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'postgresql'
        - ansible_os_family == 'Debian'

    - name: Linux | PostgreSQL on SUSE family
      block:
        - name: Refresh zypper cache on SUSE
          command: zypper --gpg-auto-import-keys refresh
          changed_when: false

        - name: Install PostgreSQL packages on SUSE
          command: zypper --non-interactive install -y postgresql-server postgresql
          args:
            creates: /usr/bin/psql

        - name: Ensure PostgreSQL data parent directory exists on SUSE
          file:
            path: /var/lib/pgsql
            state: directory
            owner: postgres
            group: postgres
            mode: "0755"

        - name: Ensure PostgreSQL data directory exists on SUSE
          file:
            path: /var/lib/pgsql/data
            state: directory
            owner: postgres
            group: postgres
            mode: "0700"

        - name: Initialize PostgreSQL database on SUSE
          command: /usr/lib/postgresql17/bin/initdb -D /var/lib/pgsql/data
          become_user: postgres
          args:
            creates: /var/lib/pgsql/data/PG_VERSION

        - name: Configure PostgreSQL listen_addresses on SUSE
          lineinfile:
            path: /var/lib/pgsql/data/postgresql.conf
            regexp: '^#?listen_addresses\s*='
            line: "listen_addresses = '*'"

        - name: Configure PostgreSQL client authentication on SUSE
          lineinfile:
            path: /var/lib/pgsql/data/pg_hba.conf
            line: "host    all             all             0.0.0.0/0               md5"

        - name: Start and enable PostgreSQL on SUSE
          systemd:
            name: postgresql
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'postgresql'
        - ansible_os_family == 'Suse'

    - name: Linux | MySQL on RedHat family
      block:
        - name: Install MySQL community repo package for EL8
          dnf:
            name: https://repo.mysql.com/mysql80-community-release-el8-1.noarch.rpm
            state: present
            disable_gpg_check: true
          when: ansible_distribution_major_version | int == 8

        - name: Install MySQL community repo package for EL9
          dnf:
            name: https://repo.mysql.com/mysql80-community-release-el9-1.noarch.rpm
            state: present
            disable_gpg_check: true
          when: ansible_distribution_major_version | int == 9

        - name: Disable default MySQL module if present
          command: dnf -qy module disable mysql
          changed_when: false
          failed_when: false

        - name: Install MySQL Community Server on RedHat
          dnf:
            name: mysql-community-server
            state: present
            disable_gpg_check: true

        - name: Clean my.cnf from unsupported static validate_password parameters
          lineinfile:
            path: /etc/my.cnf
            regexp: '^validate_password\.'
            state: absent
          failed_when: false

        - name: Start and enable MySQL on RedHat
          systemd:
            name: mysqld
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mysql'
        - ansible_os_family == 'RedHat'

    - name: Linux | MySQL on Debian family
      block:
        - name: Install MySQL packages on Debian
          apt:
            name:
              - mysql-server
            state: present
            update_cache: true

        - name: Start and enable MySQL on Debian
          service:
            name: mysql
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mysql'
        - ansible_os_family == 'Debian'

    - name: Linux | MySQL on SUSE family
      block:
        - name: Display SUSE MySQL compatibility notice
          debug:
            msg: "Oracle MySQL is not currently available from verified package sources for this SUSE target. Proceeding with MariaDB as the MySQL-compatible engine for db_type=mysql on SUSE."

        - name: Refresh zypper cache on SUSE for MySQL-compatible install
          command: zypper --gpg-auto-import-keys refresh
          changed_when: false

        - name: Install MariaDB packages for MySQL-compatible use on SUSE
          command: zypper --non-interactive install -y mariadb mariadb-client mariadb-tools
          args:
            creates: /usr/bin/mariadb

        - name: Detect MySQL-compatible server binary path on SUSE
          shell: "command -v mariadbd || command -v mysqld"
          register: mysql_compatible_server_binary
          changed_when: false

        - name: Ensure MySQL-compatible data directory exists on SUSE
          file:
            path: /var/lib/mysql
            state: directory
            owner: mysql
            group: mysql
            mode: "0755"

        - name: Initialize MySQL-compatible database on SUSE
          command: "{{ mysql_compatible_server_binary.stdout }} --initialize-insecure --user=mysql --datadir=/var/lib/mysql"
          args:
            creates: /var/lib/mysql/ibdata1
          failed_when: false

        - name: Ensure MySQL-compatible system database tables exist on SUSE
          command: mariadb-install-db --user=mysql --datadir=/var/lib/mysql
          args:
            creates: /var/lib/mysql/mysql

        - name: Detect MySQL-compatible service name on SUSE
          shell: "systemctl list-unit-files | awk '/^(mariadb|mysql)\\.service/ {print $1; exit}'"
          register: mysql_compatible_service_name
          changed_when: false

        - name: Start and enable MySQL-compatible service on SUSE
          systemd:
            name: "{{ mysql_compatible_service_name.stdout | default('mariadb.service') }}"
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mysql'
        - ansible_os_family == 'Suse'

    - name: Linux | MariaDB on RedHat family
      block:
        - name: Install MariaDB packages on RedHat
          dnf:
            name:
              - mariadb-server
              - mariadb
            state: present

        - name: Start and enable MariaDB on RedHat
          systemd:
            name: mariadb
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mariadb'
        - ansible_os_family == 'RedHat'

    - name: Linux | MariaDB on Debian family
      block:
        - name: Install MariaDB packages on Debian
          apt:
            name:
              - mariadb-server
            state: present
            update_cache: true

        - name: Start and enable MariaDB on Debian
          service:
            name: mariadb
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mariadb'
        - ansible_os_family == 'Debian'

    - name: Linux | MariaDB on SUSE family
      block:
        - name: Refresh zypper cache on SUSE for MariaDB
          command: zypper --gpg-auto-import-keys refresh
          changed_when: false

        - name: Install MariaDB packages on SUSE
          command: zypper --non-interactive install -y mariadb mariadb-client mariadb-tools
          args:
            creates: /usr/bin/mariadb

        - name: Detect MariaDB server binary path on SUSE
          shell: "command -v mariadbd || command -v mysqld"
          register: mariadb_server_binary
          changed_when: false

        - name: Ensure MariaDB data directory exists on SUSE
          file:
            path: /var/lib/mysql
            state: directory
            owner: mysql
            group: mysql
            mode: "0755"

        - name: Initialize MariaDB database on SUSE
          command: "{{ mariadb_server_binary.stdout }} --initialize-insecure --user=mysql --datadir=/var/lib/mysql"
          args:
            creates: /var/lib/mysql/ibdata1
          failed_when: false

        - name: Ensure MariaDB system database tables exist on SUSE
          command: mariadb-install-db --user=mysql --datadir=/var/lib/mysql
          args:
            creates: /var/lib/mysql/mysql

        - name: Detect MariaDB service name on SUSE
          shell: "systemctl list-unit-files | awk '/^(mariadb|mysql)\\.service/ {print $1; exit}'"
          register: mariadb_service_name
          changed_when: false

        - name: Start and enable MariaDB on SUSE
          systemd:
            name: "{{ mariadb_service_name.stdout | default('mariadb.service') }}"
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mariadb'
        - ansible_os_family == 'Suse'

    - name: Linux | MongoDB on RedHat family
      block:
        - name: Add MongoDB repository on RedHat
          yum_repository:
            name: mongodb-org-7.0
            description: MongoDB Repository
            baseurl: "https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org/7.0/x86_64/"
            gpgcheck: true
            enabled: true
            gpgkey: "https://pgp.mongodb.com/server-7.0.asc"

        - name: Install MongoDB packages on RedHat
          dnf:
            name: mongodb-org
            state: present

        - name: Ensure MongoDB data directory exists
          file:
            path: "{{ data_dir }}"
            state: directory
            owner: mongod
            group: mongod
            mode: "0755"

        - name: Configure MongoDB bind IP
          lineinfile:
            path: /etc/mongod.conf
            regexp: "^  bindIp:"
            line: "  bindIp: 0.0.0.0"

        - name: Start and enable MongoDB on RedHat
          systemd:
            name: mongod
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mongodb'
        - ansible_os_family == 'RedHat'

    - name: Linux | MongoDB on Debian family
      block:
        - name: Install prerequisite packages on Debian
          apt:
            name:
              - gnupg
              - curl
            state: present
            update_cache: true

        - name: Download MongoDB server 7.0 apt key on Debian
          get_url:
            url: "https://pgp.mongodb.com/server-7.0.asc"
            dest: /usr/share/keyrings/mongodb-server-7.0.asc
            mode: "0644"

        - name: Dearmor MongoDB server 7.0 apt key on Debian
          command: >-
            gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
            /usr/share/keyrings/mongodb-server-7.0.asc
          args:
            creates: /usr/share/keyrings/mongodb-server-7.0.gpg

        - name: Add MongoDB apt repository on Debian for Ubuntu 24+
          apt_repository:
            repo: "deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse"
            state: present
            filename: mongodb-org-7.0
          when:
            - ansible_distribution == 'Ubuntu'
            - ansible_distribution_major_version | int >= 24

        - name: Add MongoDB apt repository on Debian using native release
          apt_repository:
            repo: "deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/{{ ansible_distribution | lower }} {{ ansible_distribution_release }}/mongodb-org/7.0 multiverse"
            state: present
            filename: mongodb-org-7.0
          when: not (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 24)

        - name: Install MongoDB packages on Debian
          apt:
            name: mongodb-org
            state: present
            update_cache: true

        - name: Start and enable MongoDB on Debian
          service:
            name: mongod
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mongodb'
        - ansible_os_family == 'Debian'

    - name: Linux | MongoDB on SUSE
      block:
        - name: Refresh zypper cache on SUSE for MongoDB
          command: zypper --gpg-auto-import-keys refresh
          changed_when: false

        - name: Install MongoDB packages on SUSE
          command: zypper --non-interactive install -y mongodb-org
          args:
            creates: /usr/bin/mongod

        - name: Ensure MongoDB data directory exists on SUSE
          file:
            path: /var/lib/mongo
            state: directory
            owner: mongod
            group: mongod
            mode: "0755"

        - name: Configure MongoDB bind IP on SUSE
          lineinfile:
            path: /etc/mongod.conf
            regexp: '^\s*bindIp:\s*'
            line: '  bindIp: 0.0.0.0'

        - name: Start and enable MongoDB on SUSE
          systemd:
            name: mongod
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'mongodb'
        - ansible_os_family == 'Suse'

    - name: Linux | Configure PostgreSQL database and user
      block:
        - name: Create PostgreSQL database
          become_user: postgres
          shell: psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'" | grep -q 1 || psql -c "CREATE DATABASE {{ db_name }};"
          changed_when: true

        - name: Create PostgreSQL admin user
          become_user: postgres
          shell: |
            psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_admin_user }}'" | grep -q 1 || psql -c "CREATE USER {{ db_admin_user }} WITH PASSWORD '{{ db_admin_password }}';"
            psql -c "ALTER USER {{ db_admin_user }} WITH PASSWORD '{{ db_admin_password }}';"
            psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_admin_user }};"
          changed_when: true
      when:
        - platform == 'linux'
        - db_type == 'postgresql'

    - name: Linux | Configure MySQL database and user
      block:
        - name: Read MySQL temporary root password if present
          shell: grep 'temporary password' /var/log/mysqld.log | tail -1 | awk '{print $NF}'
          register: mysql_temp_password
          changed_when: false
          failed_when: false

        - name: Set MySQL root password using temporary password and relax policy
          shell: |
            # 1. Reset root with policy-compliant bootstrap password
            mysql --connect-expired-password -u root -p'{{ mysql_temp_password.stdout }}' -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'TempBootstrap@2026!';"
            # 2. Relax password policy or uninstall component
            mysql -u root -p'TempBootstrap@2026!' -e "UNINSTALL COMPONENT 'file://component_validate_password';" || true
            mysql -u root -p'TempBootstrap@2026!' -e "SET GLOBAL validate_password.policy=0; SET GLOBAL validate_password.length=4; SET GLOBAL validate_password.mixed_case_count=0; SET GLOBAL validate_password.number_count=0; SET GLOBAL validate_password.special_char_count=0;" || true
            # 3. Set desired admin password
            mysql -u root -p'TempBootstrap@2026!' -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_admin_password }}';"
          when: mysql_temp_password.stdout | length > 0
          changed_when: true
          failed_when: false

        - name: Set MySQL root password if not yet set or blank
          shell: |
            mysql -u root -e "UNINSTALL COMPONENT 'file://component_validate_password';" || true
            mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_admin_password }}';" || true
          when: mysql_temp_password.stdout | length == 0
          changed_when: false

        - name: Create MySQL database
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
          changed_when: true

        - name: Create MySQL admin user
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE USER IF NOT EXISTS '{{ db_admin_user }}'@'%' IDENTIFIED BY '{{ db_admin_password }}';"
            mysql -u root -p'{{ db_admin_password }}' -e "GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_admin_user }}'@'%';"
            mysql -u root -p'{{ db_admin_password }}' -e "FLUSH PRIVILEGES;"
          changed_when: true
      when:
        - platform == 'linux'
        - db_type == 'mysql'

    - name: Linux | Configure MariaDB database and user
      block:
        - name: Set MariaDB root password if needed
          shell: |
            mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ db_admin_password }}';" || true
          changed_when: false

        - name: Create MariaDB database
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
          changed_when: true

        - name: Create MariaDB admin user
          shell: |
            mysql -u root -p'{{ db_admin_password }}' -e "CREATE USER IF NOT EXISTS '{{ db_admin_user }}'@'%' IDENTIFIED BY '{{ db_admin_password }}';"
            mysql -u root -p'{{ db_admin_password }}' -e "GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_admin_user }}'@'%';"
            mysql -u root -p'{{ db_admin_password }}' -e "FLUSH PRIVILEGES;"
          changed_when: true
      when:
        - platform == 'linux'
        - db_type == 'mariadb'

    - name: Linux | Configure MongoDB admin user
      block:
        - name: Create MongoDB admin user
          shell: |
            mongosh admin --eval "db.createUser({user: '{{ db_admin_user }}', pwd: '{{ db_admin_password }}', roles: [{role: 'root', db: 'admin'}]})"
          register: mongodb_user_result
          failed_when: mongodb_user_result.rc != 0 and ('already exists' not in (mongodb_user_result.stdout + mongodb_user_result.stderr))
          changed_when: "'already exists' not in (mongodb_user_result.stdout + mongodb_user_result.stderr)"
      when:
        - platform == 'linux'
        - db_type == 'mongodb'

    - name: Linux | Cassandra on RedHat family
      block:
        - name: Install Java OpenJDK 11 for Cassandra
          dnf:
            name: java-11-openjdk-devel
            state: present

        - name: Add Apache Cassandra Yum repository
          yum_repository:
            name: cassandra
            description: Apache Cassandra 4.1.x Repository
            baseurl: https://redhat.cassandra.apache.org/41x/
            gpgcheck: false
            enabled: true

        - name: Install Cassandra package
          dnf:
            name: cassandra
            state: present

        - name: Configure Cassandra bind address
          lineinfile:
            path: /etc/cassandra/conf/cassandra.yaml
            regexp: '^rpc_address:'
            line: "rpc_address: 0.0.0.0"

        - name: Start and enable Cassandra service
          systemd:
            name: cassandra
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'cassandra'
        - ansible_os_family == 'RedHat'

    - name: Linux | Cassandra on Debian family
      block:
        - name: Install Java OpenJDK for Cassandra on Debian
          apt:
            name: openjdk-11-jre-headless
            state: present
            update_cache: true

        - name: Add Apache Cassandra Apt repository
          apt_repository:
            repo: "deb https://debian.cassandra.apache.org 41x main"
            state: present
            filename: cassandra

        - name: Install Cassandra on Debian
          apt:
            name: cassandra
            state: present
            update_cache: true

        - name: Start and enable Cassandra on Debian
          service:
            name: cassandra
            state: started
            enabled: true
      when:
        - platform == 'linux'
        - db_type == 'cassandra'
        - ansible_os_family == 'Debian'

    - name: Linux | Oracle Database Free 23ai on RedHat family
      block:
        - name: Check for pre-existing local Oracle RPM packages in /opt
          stat:
            path: "{{ item }}"
          register: local_oracle_packages
          loop:
            - /opt/oracle-preinstall.rpm
            - /opt/oracle-database-free.rpm
            - /opt/oracle-database-free-23ai-1.0-1.el8.x86_64.rpm

        - name: Download Oracle Preinstallation RPM if URL provided and not present locally
          get_url:
            url: "{{ oracle_preinstall_url }}"
            dest: /tmp/oracle-preinstall.rpm
            mode: "0644"
            timeout: 120
          when:
            - oracle_preinstall_url | length > 0
            - not (local_oracle_packages.results[0].stat.exists | default(false))

        - name: Install Oracle OS prerequisites from available repos
          dnf:
            name:
              - libaio
              - libnsl
              - libnsl2
              - bc
              - binutils
              - glibc-devel
              - ksh
              - smartmontools
              - sysstat
              - tar
            state: present
          ignore_errors: true

        - name: Install Oracle Preinstallation RPM (with nodeps fallback)
          shell: |
            TARGET_RPM="{{ '/opt/oracle-preinstall.rpm' if (local_oracle_packages.results[0].stat.exists | default(false)) else '/tmp/oracle-preinstall.rpm' }}"
            if [ -f "$TARGET_RPM" ]; then
              dnf localinstall -y --nogpgcheck "$TARGET_RPM" || rpm -Uvh --nodeps "$TARGET_RPM" || true
            fi
          args:
            creates: /etc/security/limits.d/oracle-database-preinstall-23ai.conf
          ignore_errors: true

        - name: Download Oracle Database RPM if URL provided and not present locally
          get_url:
            url: "{{ oracle_installer_url }}"
            dest: /tmp/oracle-database-free.rpm
            mode: "0644"
            timeout: 900
          when:
            - oracle_installer_url | length > 0
            - not (local_oracle_packages.results[1].stat.exists | default(false))
            - not (local_oracle_packages.results[2].stat.exists | default(false))

        - name: Install Oracle Database RPM (with nodeps fallback)
          shell: |
            TARGET_RPM="{{
              '/opt/oracle-database-free.rpm' if (local_oracle_packages.results[1].stat.exists | default(false))
              else ('/opt/oracle-database-free-23ai-1.0-1.el8.x86_64.rpm' if (local_oracle_packages.results[2].stat.exists | default(false))
              else '/tmp/oracle-database-free.rpm')
            }}"
            timeout 1800 dnf localinstall -y --nogpgcheck "$TARGET_RPM" || timeout 1800 rpm -Uvh --nodeps "$TARGET_RPM"
          args:
            creates: /etc/init.d/oracle-free-23ai
          async: 2400
          poll: 15

        - name: Check if Oracle database is already configured
          stat:
            path: /opt/oracle/oradata/FREE
          register: oracle_db_dir

        - name: Install pexpect on target (required by the expect module)
          dnf:
            name: python3-pexpect
            state: present
          when: not oracle_db_dir.stat.exists

        - name: Silently configure Oracle Database
          expect:
            command: /etc/init.d/oracle-free-23ai configure
            responses:
              '(?i)password.*:':
                - "{{ db_admin_password }}"
                - "{{ db_admin_password }}"
                - "{{ db_admin_password }}"
                - "{{ db_admin_password }}"
                - "{{ db_admin_password }}"
                - "{{ db_admin_password }}"
                - "{{ db_admin_password }}"
                - "{{ db_admin_password }}"
            timeout: 1800
          when: not oracle_db_dir.stat.exists
          changed_when: true
          register: oracle_configure
          ignore_errors: true
          no_log: true

        - name: Show Oracle configure result (password masked)
          debug:
            msg:
              failed: "{{ oracle_configure.failed | default(false) }}"
              rc: "{{ oracle_configure.rc | default('n/a') }}"
              msg: "{{ oracle_configure.msg | default('') | replace(db_admin_password, '***') }}"
              stdout: "{{ oracle_configure.stdout | default('') | replace(db_admin_password, '***') }}"
              stderr: "{{ oracle_configure.stderr | default('') | replace(db_admin_password, '***') }}"
          when: not oracle_db_dir.stat.exists

        - name: Fail if Oracle configure failed
          fail:
            msg: "Oracle configure failed, see the previous task output."
          when:
            - not oracle_db_dir.stat.exists
            - oracle_configure.failed | default(false)

        - name: Create systemd unit for Oracle Database (RPM ships only an init script)
          copy:
            dest: /etc/systemd/system/oracle-free-23ai.service
            owner: root
            group: root
            mode: "0644"
            content: |
              [Unit]
              Description=Oracle Database Free 23ai
              After=network.target

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/etc/init.d/oracle-free-23ai start
              ExecStop=/etc/init.d/oracle-free-23ai stop
              TimeoutSec=600

              [Install]
              WantedBy=multi-user.target

        - name: Start and enable Oracle Database service
          systemd:
            name: oracle-free-23ai
            state: started
            enabled: true
            daemon_reload: true
      when:
        - platform == 'linux'
        - db_type == 'oracle'
        - oracle_release != '19c'
        - ansible_os_family == 'RedHat'

    # Selected with the survey/extra var oracle_db_version=19c. The 3 GB installer ZIP is not in git: the
    # target pulls it from the file server with sshpass scp (same as install_stap_*.yml), using the AWX
    # credential that injects source_ssh_password. Optional vars: source_host, source_user,
    # source_installer_path, oracle_19c_zip_path, oracle_19c_zip_sha256, oracle_19c_pdb_name, oracle_19c_edition.
    - name: Linux | Oracle Database 19c on RedHat family (separate from Free 23ai)
      block:
        - name: Validate database inputs (Oracle rejects other characters in the password)
          assert:
            that:
              - db_name is match('^[A-Za-z][A-Za-z0-9]{0,7}$')
              - db_admin_password is match('^[A-Za-z0-9_]{8,30}$')
              - db_admin_password is match('.*[A-Z].*')
              - db_admin_password is match('.*[a-z].*')
              - db_admin_password is match('.*[0-9].*')
            fail_msg: >-
              db_name must be 1-8 letters/digits starting with a letter (it becomes the SID).
              db_admin_password must be 8-30 characters using only letters, digits and underscore,
              with at least one uppercase letter, one lowercase letter and one digit.

        - name: Require a RedHat-family x86_64 target
          assert:
            that:
              - ansible_os_family == 'RedHat'
              - ansible_architecture == 'x86_64'
            fail_msg: "Oracle 19c automation supports RedHat-family x86_64 Linux only."

        - name: Display installation parameters
          debug:
            msg: |
              Oracle 19c installation parameters
              ==================================
              Target: {{ ansible_host }} ({{ ansible_distribution }} {{ ansible_distribution_version }})
              SID / global name: {{ oracle_sid }}
              PDB: {{ oracle_pdb_name }}
              Edition: {{ oracle_edition }}
              ORACLE_HOME: {{ oracle_home }}
              Data directory: {{ oracle_data_dir }}
              Installer ZIP: {{ oracle_zip_path }}

        - name: Check whether the software install already completed
          stat:
            path: "{{ oracle_home }}/.runinstaller_done"
          register: sw_done

        - name: Check whether something already listens on port 1521
          shell: "ss -ltn | grep -q ':1521 '"
          register: port_1521
          changed_when: false
          failed_when: false

        - name: Fail early when port 1521 is taken by another database (for example Oracle Free 23ai)
          fail:
            msg: >-
              Port 1521 is already in use on this host. Oracle 19c needs a machine without another
              Oracle listener (such as Oracle Database Free 23ai). Use a clean target.
          when:
            - not sw_done.stat.exists
            - port_1521.rc == 0

        - name: Check that the host name resolves (Oracle installers need it)
          shell: "getent hosts $(hostname -f) || getent hosts $(hostname)"
          register: hostname_check
          changed_when: false
          failed_when: false

        - name: Add the host name to /etc/hosts when it does not resolve
          lineinfile:
            path: /etc/hosts
            line: "{{ ansible_default_ipv4.address }} {{ ansible_fqdn }} {{ ansible_hostname }}"
            regexp: "^{{ ansible_default_ipv4.address | regex_escape }}\\s"
          when: hostname_check.rc != 0

        - name: Install OS prerequisites (packages missing from the repos are skipped)
          shell: >-
            dnf install -y --setopt=strict=0 bc binutils elfutils-libelf elfutils-libelf-devel
            fontconfig-devel glibc glibc-devel ksh libaio libaio-devel libX11 libXau libXi
            libXrender libXtst libgcc libnsl libnsl2 libstdc++ libstdc++-devel libxcb
            libxcrypt-compat make policycoreutils smartmontools sysstat unzip
          register: os_packages
          changed_when: "'Installed:' in os_packages.stdout"

        - name: Create Oracle groups
          group:
            name: "{{ item }}"
            state: present
          loop:
            - oinstall
            - dba

        - name: Create the oracle user
          user:
            name: oracle
            group: oinstall
            groups: dba
            shell: /bin/bash
            create_home: true
            state: present

        - name: Set kernel parameters for Oracle
          copy:
            dest: /etc/sysctl.d/97-oracle-database-sysctl.conf
            mode: "0644"
            content: |
              fs.aio-max-nr = 1048576
              fs.file-max = 6815744
              kernel.shmall = 1073741824
              kernel.shmmax = 4398046511104
              kernel.shmmni = 4096
              kernel.sem = 250 32000 100 128
              net.ipv4.ip_local_port_range = 9000 65500
              net.core.rmem_default = 262144
              net.core.rmem_max = 4194304
              net.core.wmem_default = 262144
              net.core.wmem_max = 1048576
          register: sysctl_file

        - name: Apply kernel parameters
          command: sysctl -p /etc/sysctl.d/97-oracle-database-sysctl.conf
          when: sysctl_file.changed

        - name: Set shell limits for the oracle user
          copy:
            dest: /etc/security/limits.d/oracle-19c.conf
            mode: "0644"
            content: |
              oracle soft nofile 1024
              oracle hard nofile 65536
              oracle soft nproc 16384
              oracle hard nproc 16384
              oracle soft stack 10240
              oracle hard stack 32768

        - name: Create Oracle directories
          file:
            path: "{{ item }}"
            state: directory
            owner: oracle
            group: oinstall
            mode: "0775"
          loop:
            - "{{ oracle_base }}"
            - "{{ oracle_home }}"
            - "{{ oracle_inventory }}"
            - "{{ oracle_data_dir }}"

        - name: Check free disk space under /u01 (ZIP, software and database need about 20 GB)
          shell: "df -BG --output=avail /u01/app | tail -1 | tr -dc '0-9'"
          register: free_gb
          changed_when: false

        - name: Fail when there is not enough disk space
          fail:
            msg: "Only {{ free_gb.stdout }} GB free on the filesystem holding /u01. Oracle 19c needs about 20 GB."
          when:
            - not sw_done.stat.exists
            - free_gb.stdout | int < 20

        - name: Check whether the installer ZIP is already on the target
          stat:
            path: "{{ oracle_zip_path }}"
            get_checksum: false
          register: zip_stat
          when: not sw_done.stat.exists

        - name: Require the file server credential when the installer ZIP must be fetched
          assert:
            that:
              - source_ssh_password is defined
              - source_ssh_password | length > 0
            fail_msg: "Injected credential variable missing: source_ssh_password (file server password for {{ file_server_user }}@{{ file_server_host }})"
          when:
            - not sw_done.stat.exists
            - not zip_stat.stat.exists

        - name: Install sshpass on the target when it is missing (needed for the scp step)
          shell: "command -v sshpass >/dev/null 2>&1 || dnf install -y sshpass"
          register: sshpass_install
          changed_when: "'Installed' in sshpass_install.stdout"
          failed_when: false
          when:
            - not sw_done.stat.exists
            - not zip_stat.stat.exists

        - name: Check that sshpass is available on the target
          shell: "command -v sshpass"
          register: sshpass_check
          changed_when: false
          failed_when: false
          when:
            - not sw_done.stat.exists
            - not zip_stat.stat.exists

        - name: Fail when sshpass is not available on the target
          fail:
            msg: >-
              sshpass is not installed on the target and could not be installed from its repositories
              (it is usually in EPEL). Install sshpass on the target, or copy the ZIP to
              {{ oracle_zip_path }} on the target first.
          when:
            - not sw_done.stat.exists
            - not zip_stat.stat.exists
            - sshpass_check.rc != 0

        - name: Copy the 19c installer ZIP from the file server to the target via scp
          shell: >-
            sshpass -e scp -O -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            {{ file_server_user }}@{{ file_server_host }}:{{ file_server_path }}
            {{ oracle_zip_path }}
          environment:
            SSHPASS: "{{ source_ssh_password }}"
          args:
            creates: "{{ oracle_zip_path }}"
          async: 3600
          poll: 15
          no_log: true
          when:
            - not sw_done.stat.exists
            - not zip_stat.stat.exists

        - name: Re-check the installer ZIP with its checksum
          stat:
            path: "{{ oracle_zip_path }}"
            checksum_algorithm: sha256
            get_checksum: true
          register: zip_final
          when: not sw_done.stat.exists

        - name: Fail with instructions when the installer ZIP is missing or damaged
          fail:
            msg: >-
              Installer ZIP not found or checksum mismatch at {{ oracle_zip_path }} on the target.
              It is fetched from {{ file_server_user }}@{{ file_server_host }}:{{ file_server_path }}.
              Check that the file exists there and is complete. Expected sha256 {{ oracle_zip_sha256 }}.
          when:
            - not sw_done.stat.exists
            - (not zip_final.stat.exists) or (zip_final.stat.checksum | default('') != oracle_zip_sha256)

        - name: Make the ZIP readable by the oracle user
          file:
            path: "{{ oracle_zip_path }}"
            mode: "0644"
          when: not sw_done.stat.exists

        - name: Unzip the 19c software into ORACLE_HOME
          shell: >-
            runuser -u oracle -- unzip -oq {{ oracle_zip_path }} -d {{ oracle_home }}
            && touch {{ oracle_home }}/.unzip_done
          args:
            creates: "{{ oracle_home }}/.unzip_done"
          async: 3600
          poll: 15
          when: not sw_done.stat.exists

        - name: Work around the 19.3 link error on RHEL 8 and newer (ins_emagent.mk needs -lnnz19)
          shell: |
            F={{ oracle_home }}/sysman/lib/ins_emagent.mk
            grep -q 'MK_EMAGENT_NMECTL) -lnnz19' "$F" || sed -i 's/\$(MK_EMAGENT_NMECTL)/\$(MK_EMAGENT_NMECTL) -lnnz19/g' "$F"
          changed_when: false
          when:
            - not sw_done.stat.exists
            - ansible_distribution_major_version | int >= 8

        - name: Write the software install response file
          copy:
            dest: /tmp/db_install_19c.rsp
            owner: oracle
            group: oinstall
            mode: "0600"
            content: |
              oracle.install.responseFileVersion=/oracle/install/rspfmt_dbinstall_response_schema_v19.0.0
              oracle.install.option=INSTALL_DB_SWONLY
              UNIX_GROUP_NAME=oinstall
              INVENTORY_LOCATION={{ oracle_inventory }}
              ORACLE_HOME={{ oracle_home }}
              ORACLE_BASE={{ oracle_base }}
              oracle.install.db.InstallEdition={{ oracle_edition }}
              oracle.install.db.OSDBA_GROUP=dba
              oracle.install.db.OSOPER_GROUP=dba
              oracle.install.db.OSBACKUPDBA_GROUP=dba
              oracle.install.db.OSDGDBA_GROUP=dba
              oracle.install.db.OSKMDBA_GROUP=dba
              oracle.install.db.OSRACDBA_GROUP=dba
              SECURITY_UPDATES_VIA_MYORACLESUPPORT=false
              DECLINE_SECURITY_UPDATES=true
          when: not sw_done.stat.exists

        - name: Install Oracle 19c software (runInstaller exit code 6 means completed with warnings)
          shell: |
            runuser -u oracle -- env CV_ASSUME_DISTID=OL8 ORACLE_HOME={{ oracle_home }} ORACLE_BASE={{ oracle_base }} \
              {{ oracle_home }}/runInstaller -silent -ignorePrereqs -waitforcompletion \
              -responseFile /tmp/db_install_19c.rsp
            rc=$?
            if [ $rc -eq 0 ] || [ $rc -eq 6 ]; then
              touch {{ oracle_home }}/.runinstaller_installed
              exit 0
            fi
            exit $rc
          args:
            creates: "{{ oracle_home }}/.runinstaller_installed"
          async: 3600
          poll: 15
          when: not sw_done.stat.exists

        - name: Run the root scripts
          shell: |
            yes '' | {{ oracle_inventory }}/orainstRoot.sh
            yes '' | {{ oracle_home }}/root.sh
            touch {{ oracle_home }}/.runinstaller_done
          args:
            creates: "{{ oracle_home }}/.runinstaller_done"
          async: 900
          poll: 10
          when: not sw_done.stat.exists

        - name: Remove the software install response file
          file:
            path: /tmp/db_install_19c.rsp
            state: absent

        - name: Create the listener on port 1521
          shell: >-
            runuser -u oracle -- env ORACLE_HOME={{ oracle_home }} ORACLE_BASE={{ oracle_base }}
            {{ oracle_home }}/bin/netca -silent -responseFile {{ oracle_home }}/assistants/netca/netca.rsp
          args:
            creates: "{{ oracle_home }}/network/admin/listener.ora"
          async: 600
          poll: 10

        - name: Check whether the database already exists
          shell: "grep -q '^{{ oracle_sid }}:' /etc/oratab"
          register: db_exists
          changed_when: false
          failed_when: false

        - name: Create the 19c container database with dbca
          shell: |
            timeout 3600 runuser -u oracle -- env ORACLE_HOME={{ oracle_home }} ORACLE_BASE={{ oracle_base }} \
              {{ oracle_home }}/bin/dbca -silent -createDatabase \
              -templateName General_Purpose.dbc \
              -gdbName {{ oracle_sid }} -sid {{ oracle_sid }} \
              -responseFile NO_VALUE -characterSet AL32UTF8 \
              -sysPassword "$ORA_PW" -systemPassword "$ORA_PW" \
              -createAsContainerDatabase true -numberOfPDBs 1 \
              -pdbName {{ oracle_pdb_name }} -pdbAdminPassword "$ORA_PW" \
              -databaseType MULTIPURPOSE -automaticMemoryManagement false \
              -storageType FS -datafileDestination {{ oracle_data_dir }} \
              -redoLogFileSize 50 -emConfiguration NONE -ignorePreReqs
          environment:
            ORA_PW: "{{ db_admin_password }}"
          register: dbca_result
          async: 3900
          poll: 30
          no_log: true
          when: db_exists.rc != 0

        - name: Mark the database to start automatically
          lineinfile:
            path: /etc/oratab
            regexp: "^{{ oracle_sid }}:"
            line: "{{ oracle_sid }}:{{ oracle_home }}:Y"

        - name: Open all pluggable databases and save their state so they open after a restart
          shell: |
            runuser -u oracle -- env ORACLE_HOME={{ oracle_home }} ORACLE_SID={{ oracle_sid }} {{ oracle_home }}/bin/sqlplus -s / as sysdba <<'EOF'
            alter pluggable database all open;
            alter pluggable database all save state;
            exit
            EOF
          changed_when: false

        - name: Create a systemd unit that starts and stops the database with dbstart and dbshut
          copy:
            dest: /etc/systemd/system/oracle-19c.service
            owner: root
            group: root
            mode: "0644"
            content: |
              [Unit]
              Description=Oracle Database 19c
              After=network.target

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              User=oracle
              Group=oinstall
              Environment=ORACLE_HOME={{ oracle_home }}
              Environment=ORACLE_SID={{ oracle_sid }}
              ExecStart={{ oracle_home }}/bin/dbstart {{ oracle_home }}
              ExecStop={{ oracle_home }}/bin/dbshut {{ oracle_home }}
              TimeoutSec=900

              [Install]
              WantedBy=multi-user.target

        - name: Enable the Oracle 19c service
          systemd:
            name: oracle-19c
            enabled: true
            daemon_reload: true

        - name: Verify the database and the pluggable database are open read write
          shell: |
            runuser -u oracle -- env ORACLE_HOME={{ oracle_home }} ORACLE_SID={{ oracle_sid }} {{ oracle_home }}/bin/sqlplus -s / as sysdba <<'EOF'
            set heading off feedback off pagesize 0
            select name || ' ' || open_mode from v$database;
            select name || ' ' || open_mode from v$pdbs;
            exit
            EOF
          register: db_check
          changed_when: false

        - name: Fail when the databases are not open read write
          fail:
            msg: "Oracle 19c check failed. Output: {{ db_check.stdout }}"
          when: >-
            ((oracle_sid ~ ' READ WRITE') not in db_check.stdout)
            or ((oracle_pdb_name ~ ' READ WRITE') not in db_check.stdout)

        - name: Installation summary
          debug:
            msg: |
              Oracle Database 19c installed on {{ ansible_host }}
              Container database: {{ oracle_sid }}   Pluggable database: {{ oracle_pdb_name }}
              Connect: {{ ansible_host }}:1521/{{ oracle_pdb_name }}
              Users: sys (as sysdba), system, pdbadmin with the survey password
              ORACLE_HOME: {{ oracle_home }}
      when:
        - platform == 'linux'
        - db_type == 'oracle'
        - oracle_release == '19c'
        - ansible_os_family == 'RedHat'

    - name: Linux | IBM Db2 on RedHat family
      block:
        - name: Install Db2 OS prerequisites
          dnf:
            name:
              - libaio
              - numactl
              - libstdc++
              - pam
              - ksh
            state: present

        - name: Ensure Db2 groups and users exist
          user:
            name: "{{ item }}"
            state: present
          loop:
            - db2inst1
            - db2fenc1

        - name: Download Db2 installer archive if URL provided
          get_url:
            url: "{{ db2_installer_url }}"
            dest: /tmp/db2_installer.tar.gz
            mode: "0644"
          when: db2_installer_url | length > 0

        - name: Unarchive Db2 installer
          unarchive:
            src: "{{ '/tmp/db2_installer.tar.gz' if (db2_installer_url | length > 0) else '/opt/db2_installer.tar.gz' }}"
            dest: /tmp
            remote_src: true

        - name: Execute Db2 silent install
          command: /tmp/server_dec/db2_install -y -b /opt/ibm/db2/V11.5 -p SERVER
          args:
            creates: /opt/ibm/db2/V11.5/bin/db2

        - name: Create Db2 Instance
          command: /opt/ibm/db2/V11.5/instance/db2icrt -u db2fenc1 db2inst1
          args:
            creates: /home/db2inst1/sqllib/db2profile

        - name: Start Db2 and create database
          shell: |
            su - db2inst1 -c "
            db2start || true
            db2 update dbm cfg using svcename 50000 || true
            db2set DB2COMM=tcpip || true
            db2 create db {{ db_name }} || true
            "
          changed_when: true
      when:
        - platform == 'linux'
        - db_type == 'db2'
        - ansible_os_family == 'RedHat'

    - name: Linux | IBM Informix on RedHat family
      block:
        - name: Install Informix OS prerequisites
          dnf:
            name:
              - libaio
              - pam
              - ncurses
            state: present

        - name: Ensure Informix user exists
          user:
            name: informix
            state: present

        - name: Download Informix installer archive if URL provided
          get_url:
            url: "{{ informix_installer_url }}"
            dest: /tmp/informix_installer.tar
            mode: "0644"
          when: informix_installer_url | length > 0

        - name: Unpack Informix installer
          unarchive:
            src: "{{ '/tmp/informix_installer.tar' if (informix_installer_url | length > 0) else '/opt/informix_installer.tar' }}"
            dest: /tmp
            remote_src: true

        - name: Run Informix silent installer
          command: /tmp/ids_install -i silent -DLICENSE_ACCEPTED=TRUE -DUSER_INSTALL_DIR=/opt/ibm/informix
          args:
            creates: /opt/ibm/informix/bin/oninit

        - name: Initialize Informix Server Engine
          shell: |
            export INFORMIXDIR=/opt/ibm/informix
            export PATH=$INFORMIXDIR/bin:$PATH
            export ONCONFIG=onconfig.std
            export INFORMIXSERVER=ol_informix1410
            oninit -ivy || true
          become_user: informix
          changed_when: true
      when:
        - platform == 'linux'
        - db_type == 'informix'
        - ansible_os_family == 'RedHat'

    - name: Windows | PostgreSQL not yet implemented
      fail:
        msg: "Windows automated installation for PostgreSQL is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'postgresql'

    - name: Windows | MySQL not yet implemented
      fail:
        msg: "Windows automated installation for MySQL is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'mysql'

    - name: Windows | MariaDB not yet implemented
      fail:
        msg: "Windows automated installation for MariaDB is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'mariadb'

    - name: Windows | MongoDB not yet implemented
      fail:
        msg: "Windows automated installation for MongoDB is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'mongodb'

    - name: Windows | Cassandra not yet implemented
      fail:
        msg: "Windows automated installation for Cassandra is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'cassandra'

    - name: Windows | Oracle not yet implemented
      fail:
        msg: "Windows automated installation for Oracle is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'oracle'

    - name: Windows | Db2 not yet implemented
      fail:
        msg: "Windows automated installation for Db2 is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'db2'

    - name: Windows | Informix not yet implemented
      fail:
        msg: "Windows automated installation for Informix is not yet implemented."
      when:
        - platform == 'windows'
        - db_type == 'informix'

  post_tasks:
    - name: Display success message
      debug:
        msg: |
          Database installation completed.

          Details:
          - Platform: {{ platform }}
          - Type: {{ db_type }}
          - Database Name: {{ db_name }}
          - Admin User: {{ db_admin_user }}
          - Port: {{ db_port }}
          - Data Directory: {{ data_dir }}

