---
# Dynamic Ansible Playbook for Installing MS SQL Server Management Studio (SSMS)
# This playbook prompts for all required information at runtime
#
# Usage:
#   ansible-playbook install_ssms_dynamic.yml
#
# The playbook will prompt for:
# - Target Windows Server IP
# - Windows Admin Username
# - Windows Admin Password
# - SQL Server Database Username
# - SQL Server Database Password
# - SSMS Version (optional)

- name: Gather Dynamic Input for SSMS Installation
  hosts: localhost
  gather_facts: no
  
  vars_prompt:
    - name: target_host
      prompt: "Enter the Windows Server IP address or hostname"
      private: no
      
    - name: windows_username
      prompt: "Enter Windows Administrator username"
      private: no
      default: "Administrator"
      
    - name: windows_password
      prompt: "Enter Windows Administrator password"
      private: yes
      
    - name: sql_username
      prompt: "Enter SQL Server Database username (sa or custom)"
      private: no
      default: "sa"
      
    - name: sql_password
      prompt: "Enter SQL Server Database password"
      private: yes
      
    - name: ssms_version
      prompt: "Enter SSMS version to install (press Enter for latest)"
      private: no
      default: "20.2"
      
    - name: ssms_download_url
      prompt: "Enter SSMS download URL (press Enter for latest)"
      private: no
      default: "https://aka.ms/ssmsfullsetup"
      
    - name: restart_after_install
      prompt: "Restart server after installation? (yes/no)"
      private: no
      default: "no"

  tasks:
    - name: Add target host to inventory dynamically
      add_host:
        name: "{{ target_host }}"
        groups: dynamic_windows_servers
        ansible_host: "{{ target_host }}"
        ansible_user: "{{ windows_username }}"
        ansible_password: "{{ windows_password }}"
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_port: 5985
        ssms_version: "{{ ssms_version }}"
        ssms_download_url: "{{ ssms_download_url }}"
        sql_db_username: "{{ sql_username }}"
        sql_db_password: "{{ sql_password }}"
        restart_required: "{{ restart_after_install }}"

    - name: Display configuration summary
      debug:
        msg:
          - "=========================================="
          - "Configuration Summary"
          - "=========================================="
          - "Target Server: {{ target_host }}"
          - "Windows User: {{ windows_username }}"
          - "SQL DB User: {{ sql_username }}"
          - "SSMS Version: {{ ssms_version }}"
          - "Restart After Install: {{ restart_after_install }}"
          - "=========================================="

- name: Install MS SQL Server Management Studio on Windows
  hosts: dynamic_windows_servers
  gather_facts: yes
  
  vars:
    ssms_installer_path: "C:\\Temp\\SSMS-Setup-ENU.exe"
    ssms_install_dir: "C:\\Program Files (x86)\\Microsoft SQL Server Management Studio {{ ssms_version }}"
    ssms_log_path: "C:\\Temp\\SSMS_Install_Log.txt"
    sql_config_path: "C:\\Temp\\sql_connection_config.txt"
    install_timeout: 3600

  tasks:
    - name: Display target server information
      debug:
        msg: 
          - "Target Server: {{ inventory_hostname }}"
          - "OS: {{ ansible_os_family }}"
          - "OS Version: {{ ansible_os_name }}"
          - "SSMS Version to Install: {{ ssms_version }}"

    - name: Test WinRM connectivity
      win_ping:
      register: winrm_test

    - name: Display connectivity status
      debug:
        msg: "WinRM connection successful to {{ inventory_hostname }}"
      when: winrm_test is succeeded

    - name: Ensure Temp directory exists
      win_file:
        path: C:\Temp
        state: directory

    - name: Check if SSMS is already installed
      win_reg_stat:
        path: HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server Management Studio
      register: ssms_installed

    - name: Get installed SSMS version if exists
      win_shell: |
        $ssmsPath = "C:\Program Files (x86)\Microsoft SQL Server Management Studio*\Common7\IDE\Ssms.exe"
        if (Test-Path $ssmsPath) {
          $version = (Get-Item $ssmsPath).VersionInfo.FileVersion
          Write-Output $version
        } else {
          Write-Output "Not Installed"
        }
      register: current_ssms_version
      changed_when: false
      failed_when: false

    - name: Display current SSMS status
      debug:
        msg: 
          - "SSMS Installation Status: {{ 'Installed' if ssms_installed.exists else 'Not Installed' }}"
          - "Current Version: {{ current_ssms_version.stdout | trim }}"

    - name: Check SQL Server service status
      win_service:
        name: MSSQLSERVER
      register: sql_service
      ignore_errors: yes

    - name: Display SQL Server service status
      debug:
        msg: "SQL Server Service Status: {{ sql_service.state | default('Not Found') }}"

    - name: Test SQL Server connectivity
      win_shell: |
        $serverName = "localhost"
        $username = "{{ sql_db_username }}"
        $password = "{{ sql_db_password }}"
        
        try {
          $connectionString = "Server=$serverName;User Id=$username;Password=$password;TrustServerCertificate=True"
          $connection = New-Object System.Data.SqlClient.SqlConnection($connectionString)
          $connection.Open()
          $command = $connection.CreateCommand()
          $command.CommandText = "SELECT @@VERSION"
          $version = $command.ExecuteScalar()
          $connection.Close()
          Write-Output "SUCCESS: Connected to SQL Server"
          Write-Output $version
          exit 0
        } catch {
          Write-Output "FAILED: Cannot connect to SQL Server"
          Write-Output $_.Exception.Message
          exit 1
        }
      register: sql_connectivity
      ignore_errors: yes
      changed_when: false

    - name: Display SQL Server connectivity result
      debug:
        msg: "{{ sql_connectivity.stdout_lines }}"
      when: sql_connectivity.stdout_lines is defined

    - name: Download SSMS installer
      win_get_url:
        url: "{{ ssms_download_url }}"
        dest: "{{ ssms_installer_path }}"
        force: no
        timeout: 600
      register: download_result
      when: not ssms_installed.exists or (current_ssms_version.stdout | trim) != ssms_version

    - name: Display download progress
      debug:
        msg: 
          - "Downloading SSMS installer..."
          - "Source: {{ ssms_download_url }}"
          - "Destination: {{ ssms_installer_path }}"
      when: download_result.changed

    - name: Verify installer download
      win_stat:
        path: "{{ ssms_installer_path }}"
      register: installer_file

    - name: Display installer file info
      debug:
        msg:
          - "Installer Path: {{ ssms_installer_path }}"
          - "File Size: {{ (installer_file.stat.size / 1024 / 1024) | round(2) }} MB"
          - "File Exists: {{ installer_file.stat.exists }}"
      when: installer_file.stat.exists

    - name: Fail if installer not found
      fail:
        msg: "SSMS installer not found at {{ ssms_installer_path }}"
      when: not installer_file.stat.exists

    - name: Install SSMS silently (This may take 15-30 minutes)
      win_package:
        path: "{{ ssms_installer_path }}"
        product_id: "SQL Server Management Studio"
        arguments: 
          - /install
          - /quiet
          - /norestart
          - /log "{{ ssms_log_path }}"
        state: present
        creates_path: "C:\\Program Files (x86)\\Microsoft SQL Server Management Studio"
      register: install_result
      async: "{{ install_timeout }}"
      poll: 30
      when: not ssms_installed.exists or (current_ssms_version.stdout | trim) != ssms_version

    - name: Display installation status
      debug:
        msg: "SSMS installation in progress... Please wait (this may take 15-30 minutes)"
      when: install_result.changed

    - name: Wait for installation to complete
      async_status:
        jid: "{{ install_result.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 120
      delay: 30
      when: install_result.ansible_job_id is defined

    - name: Check installation log
      win_shell: |
        if (Test-Path "{{ ssms_log_path }}") {
          $log = Get-Content "{{ ssms_log_path }}" -Tail 100
          $errors = $log | Select-String -Pattern "error|failed" -CaseSensitive:$false
          if ($errors) {
            Write-Output "=== ERRORS FOUND IN LOG ==="
            $errors | ForEach-Object { Write-Output $_.Line }
          } else {
            Write-Output "=== Installation completed successfully ==="
            Write-Output "No errors found in installation log"
          }
        } else {
          Write-Output "Log file not found at {{ ssms_log_path }}"
        }
      register: log_check
      changed_when: false
      when: install_result.changed

    - name: Display installation log
      debug:
        msg: "{{ log_check.stdout_lines }}"
      when: log_check.stdout_lines is defined

    - name: Verify SSMS installation
      win_shell: |
        $ssmsPath = "C:\Program Files (x86)\Microsoft SQL Server Management Studio*\Common7\IDE\Ssms.exe"
        if (Test-Path $ssmsPath) {
          $version = (Get-Item $ssmsPath).VersionInfo.FileVersion
          $fileSize = (Get-Item $ssmsPath).Length / 1MB
          Write-Output "SUCCESS: SSMS Version $version installed"
          Write-Output "Executable Size: $([math]::Round($fileSize, 2)) MB"
          Write-Output "Path: $ssmsPath"
          exit 0
        } else {
          Write-Output "FAILED: SSMS installation verification failed"
          exit 1
        }
      register: verify_install
      changed_when: false

    - name: Display verification result
      debug:
        msg: "{{ verify_install.stdout_lines }}"

    - name: Save SQL Server connection configuration
      win_copy:
        content: |
          SQL Server Connection Configuration
          ====================================
          Server: {{ inventory_hostname }}
          Database User: {{ sql_db_username }}
          Connection String: Server={{ inventory_hostname }};User Id={{ sql_db_username }};Password=****;TrustServerCertificate=True
          
          SSMS Installation Details
          =========================
          Version: {{ ssms_version }}
          Installation Path: {{ ssms_install_dir }}
          Installation Date: {{ ansible_date_time.iso8601 }}
          
          Notes:
          - Use SQL Server Authentication with the credentials provided
          - SSMS executable location: C:\Program Files (x86)\Microsoft SQL Server Management Studio\Common7\IDE\Ssms.exe
          - To connect: Open SSMS -> Server name: localhost or {{ inventory_hostname }} -> Authentication: SQL Server Authentication
        dest: "{{ sql_config_path }}"
      when: install_result.changed

    - name: Create SSMS desktop shortcut
      win_shell: |
        $WshShell = New-Object -ComObject WScript.Shell
        $Shortcut = $WshShell.CreateShortcut("C:\Users\Public\Desktop\SQL Server Management Studio.lnk")
        $Shortcut.TargetPath = "C:\Program Files (x86)\Microsoft SQL Server Management Studio {{ ssms_version }}\Common7\IDE\Ssms.exe"
        $Shortcut.Description = "Microsoft SQL Server Management Studio {{ ssms_version }}"
        $Shortcut.WorkingDirectory = "C:\Program Files (x86)\Microsoft SQL Server Management Studio {{ ssms_version }}\Common7\IDE"
        $Shortcut.Save()
        Write-Output "Desktop shortcut created successfully"
      when: install_result.changed
      ignore_errors: yes
      register: desktop_shortcut

    - name: Create Start Menu shortcut
      win_shell: |
        $WshShell = New-Object -ComObject WScript.Shell
        $Shortcut = $WshShell.CreateShortcut("C:\ProgramData\Microsoft\Windows\Start Menu\Programs\SQL Server Management Studio.lnk")
        $Shortcut.TargetPath = "C:\Program Files (x86)\Microsoft SQL Server Management Studio {{ ssms_version }}\Common7\IDE\Ssms.exe"
        $Shortcut.Description = "Microsoft SQL Server Management Studio {{ ssms_version }}"
        $Shortcut.WorkingDirectory = "C:\Program Files (x86)\Microsoft SQL Server Management Studio {{ ssms_version }}\Common7\IDE"
        $Shortcut.Save()
        Write-Output "Start Menu shortcut created successfully"
      when: install_result.changed
      ignore_errors: yes
      register: startmenu_shortcut

    - name: Clean up installer file
      win_file:
        path: "{{ ssms_installer_path }}"
        state: absent
      when: install_result.changed

    - name: Restart server if required
      win_reboot:
        reboot_timeout: 600
        msg: "Restarting server after SSMS installation"
        post_reboot_delay: 60
      when: 
        - restart_required | bool
        - install_result.changed

    - name: Final verification after restart
      win_shell: |
        $ssmsPath = "C:\Program Files (x86)\Microsoft SQL Server Management Studio*\Common7\IDE\Ssms.exe"
        if (Test-Path $ssmsPath) {
          Write-Output "SSMS is ready to use"
          exit 0
        } else {
          Write-Output "SSMS verification failed"
          exit 1
        }
      register: final_check
      changed_when: false
      when: 
        - restart_required | bool
        - install_result.changed

    - name: Installation Complete Summary
      debug:
        msg:
          - "=========================================="
          - "SSMS Installation Complete!"
          - "=========================================="
          - "Server: {{ inventory_hostname }}"
          - "Status: {{ 'Successfully Installed' if install_result.changed else 'Already Installed' }}"
          - "SSMS Version: {{ ssms_version }}"
          - "Installation Path: {{ ssms_install_dir }}"
          - ""
          - "SQL Server Connection Details:"
          - "  Server: {{ inventory_hostname }}"
          - "  Username: {{ sql_db_username }}"
          - "  Authentication: SQL Server Authentication"
          - ""
          - "Configuration saved to: {{ sql_config_path }}"
          - "Installation log: {{ ssms_log_path }}"
          - ""
          - "To launch SSMS:"
          - "  - Double-click desktop shortcut, OR"
          - "  - Run: C:\\Program Files (x86)\\Microsoft SQL Server Management Studio {{ ssms_version }}\\Common7\\IDE\\Ssms.exe"
          - "=========================================="

