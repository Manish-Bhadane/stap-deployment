---
- name: Setup Dynamic Target Host
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Add target server dynamically
      add_host:
        name: dynamic_gim_target
        groups: dynamic_targets
        ansible_host: "{{ server_ip | trim }}"
        ansible_user: "{{ server_user }}"
        ansible_password: "{{ server_password }}"
        ansible_ssh_pass: "{{ server_password }}"
        ansible_become_password: "{{ server_password }}"
        ansible_connection: ssh
        ansible_shell_type: sh
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no"
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o KbdInteractiveAuthentication=no"

- name: Install Guardium GIM v12.1
  hosts: dynamic_targets
  gather_facts: yes
  become: yes
  become_method: su
  vars:
    install_dir: "{{ install_dir | default('/opt/Guardium/') }}"
    perl_dir: "{{ perl_dir | default('/usr/bin/') }}"
    listener_mode_enabled: "{{ listener_mode | default(false) | bool }}"
    failover_sqlguardip: "{{ failover_sqlguardip | default('') }}"
    shared_secret: "{{ shared_secret | default('') }}"
    source_host: "{{ source_host | default('9.46.241.103') }}"
    source_user: "{{ source_user | default('root') }}"
    source_password: "{{ source_ssh_password }}"
    source_installer_path: ""
    target_installer_path: "/tmp/{{ gim_installer }}"

  pre_tasks:
    - name: Validate required user inputs
      assert:
        that:
          - server_ip is defined
          - server_ip | trim | length > 0
          - server_user is defined
          - server_user | length > 0
          - server_password is defined
          - server_password | length > 0
          - gim_installer is defined
          - gim_installer | trim | length > 0
          - install_dir is defined
          - install_dir | trim | length > 0
          - perl_dir is defined
          - perl_dir | trim | length > 0
          - listener_mode_enabled or (sqlguard_ip is defined and sqlguard_ip | trim | length > 0)
        fail_msg: "Required survey fields missing: server_ip, server_user, server_password, gim_installer, install_dir, perl_dir, and sqlguard_ip when listener_mode is false"

    - name: Validate injected source credential password
      assert:
        that:
          - source_password is defined
          - source_password | length > 0
        fail_msg: "Injected credential variable missing: source_ssh_password"

    - name: Verify Perl executable directory exists
      stat:
        path: "{{ perl_dir }}"
      register: perl_dir_stat

    - name: Fail when Perl directory does not exist
      fail:
        msg: "Perl directory {{ perl_dir }} does not exist on target"
      when: not perl_dir_stat.stat.exists

    - name: Set default source installer path
      set_fact:
        resolved_source_installer_path: "{{ '/var/gim-repository/installers/v12.1/' ~ gim_installer if (source_installer_path | length == 0) else source_installer_path }}"

    - name: Create local temporary directory for installer staging
      delegate_to: localhost
      become: false
      tempfile:
        state: directory
        prefix: awx-gim-v12_1-
      register: local_installer_stage

  tasks:
    - name: Display selected installer
      debug:
        msg: "Installing GIM v12.1 using {{ gim_installer }} from {{ source_host }} on {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Ensure installation directory exists
      file:
        path: "{{ install_dir }}"
        state: directory
        mode: '0755'

    - name: Copy GIM installer from source host to AWX execution node
      delegate_to: localhost
      become: false
      shell: >
        sshpass -p '{{ source_password }}'
        scp -O -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        {{ source_user }}@{{ source_host }}:{{ resolved_source_installer_path }}
        {{ local_installer_stage.path }}/{{ gim_installer }}
      register: source_scp_result
      changed_when: true

    - name: Copy GIM installer from AWX execution node to target
      copy:
        src: "{{ local_installer_stage.path }}/{{ gim_installer }}"
        dest: "{{ target_installer_path }}"
        mode: '0755'
      register: target_copy_result

    - name: Ensure installer is executable
      file:
        path: "{{ target_installer_path }}"
        mode: '0755'
        state: file

    - name: Build optional GIM installer arguments
      set_fact:
        gim_optional_args: >-
          {% set parts = [] -%}
          {% if not listener_mode_enabled -%}
          {% set _ = parts.append('--sqlguardip ' ~ sqlguard_ip) -%}
          {% endif -%}
          {% if failover_sqlguardip | trim | length > 0 -%}
          {% set _ = parts.append('--failover_sqlguardip ' ~ failover_sqlguardip) -%}
          {% endif -%}
          {% if shared_secret | trim | length > 0 -%}
          {% set _ = parts.append('--shared_secret ' ~ shared_secret) -%}
          {% endif -%}
          {{ parts | join(' ') }}

    - name: Run GIM v12.1 installer
      shell: >
        cd /tmp &&
        {{ target_installer_path }}
        --dir {{ install_dir }}
        {{ gim_optional_args }}
        --tapip {{ server_ip }}
        --perl {{ perl_dir }}
        -q
      args:
        creates: "{{ install_dir.rstrip('/') }}/modules"
      register: install_result

    - name: Display installation result
      debug:
        var: install_result.stdout_lines

    - name: Verify GIM modules processes are running
      shell: ps -afe | grep modules | grep -v grep
      register: gim_process_result
      changed_when: false
      failed_when: gim_process_result.rc != 0

    - name: Check GIM service file on systemd-based RedHat
      shell: systemctl cat guard_gim.service && systemctl cat guard_gsvr.service
      register: gim_service_redhat
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Check GIM entries on Debian and SUSE
      shell: grep -E 'gim:|gsvr:' /etc/inittab
      register: gim_inittab_result
      changed_when: false
      when: ansible_os_family != 'RedHat'
      failed_when: false

    - name: Display success message
      debug:
        msg: "✅ Guardium GIM v12.1 successfully installed using {{ gim_installer }}"

  post_tasks:
    - name: Remove local temporary installer staging directory
      delegate_to: localhost
      become: false
      file:
        path: "{{ local_installer_stage.path }}"
        state: absent
      when:
        - local_installer_stage is defined
        - local_installer_stage.path is defined

